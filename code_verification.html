              <p class="subtitle">
                تم ارسال رمز مكون من 6 ارقام الى البريد الإلكتروني
              </p>
            </div>

            <form>
              <div class="otp-container">
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input"

                />

                لم تستلم رمزًا؟
                <a href="#" class="resend">إعادة الإرسال</a>
              </div>

              <button type="submit" class="btn-submit-green">التحقق</button>
              <p class="timer text-center font-20 mt-3">00:15</p>
            </form>
          </div>
        </div>
