    />

  </head>

  <body>
    <div class="container-fluid p-0 full-screen-container">
      <div class="row g-0 w-100 h-100">
        <div class="col-md-6 right-design-section d-none d-md-block">
          <div class="promo-container">
            <img
              src="assets/images/Promo image.png"
              alt="احنا صوتكم"
              class="promo-img main-circle"
            />

            <img
              src="assets/images/Promo image (1).png"
              alt="شعار صوت"
              class="promo-img logo-circle"
            />

            <img
              src="assets/images/Experience banner.png"
              alt="10 سنوات خبرة"
              class="promo-img badge-cloud"
            />

            <div class="bottom-text-wrapper count">
              <h2 class="promo-title">
                صوت من لا <span class="sawt-lh">صوت له</span>
              </h2>
            </div>
          </div>
        </div>

        <!-- الجانب الأيسر: نموذج تسجيل الدخول -->
        <div class="col-md-6 left-form-section col-12">
          <div class="form-wrapper postion-relative">
            <img
              src="assets/images/leaf_cutout.png"
              class="olive-branch branch-left-top-content-section"
              alt="Olive Branch"
            />
            <img
              src="assets/images/leaf_cutout.png"
              class="olive-branch branch-right-bottom-content-section"
              alt="Olive Branch"
            />
            <div class="text-center mobile-logo d-md-none">
              <img src="assets/images/صوت 1.png" alt="Sawt Logo" />
            </div>
            <div class="text-center">
              <h1 class="title">تسجيل حساب جديد</h1>
              <p class="subtitle">أنشئ حساب مع صوت و تابع اخر التطورات</p>
            </div>
            <form>
              <div class="row">
                <div class="col-6">
                  <div class="input-group-custom mb-3">
                    <i class="input-icon-main">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="1.3em"
                        height="1.3em"
                        viewBox="0 0 24 24"
                      >
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path
                          fill="currentColor"
                          d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5s-5 2.24-5 5s2.24 5 5 5m0-8c1.65 0 3 1.35 3 3s-1.35 3-3 3s-3-1.35-3-3s1.35-3 3-3M4 22h16c.55 0 1-.45 1-1v-1c0-3.86-3.14-7-7-7h-4c-3.86 0-7 3.14-7 7v1c0 .55.45 1 1 1m6-7h4c2.76 0 5 2.24 5 5H5c0-2.76 2.24-5 5-5"
                        />
                      </svg>
                    </i>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="الاسم الأول"
                      required
                    />
                  </div>
                </div>
                <div class="col-6">
                  <div class="input-group-custom mb-3">
                    <input
                      type="text"
                      class="form-control no-icon"
                      placeholder="اسم العائلة"
                      required
                    />
                  </div>
                </div>
              </div>
              <!-- حقل البريد الإلكتروني مع الأيقونة بداخلها -->
              <div class="input-group-custom mb-3">
                <i class="input-icon-main">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="1.3em"
                    height="1.3em"
                    viewBox="0 0 24 24"
                  >
                    <path d="M0 0h24v24H0z" fill="none" />
                    <g
                      fill="none"
                      stroke="currentColor"
                      stroke-linejoin="round"
                      stroke-width="1.5"
                    >
                      <path
                        stroke-linecap="round"
                        d="m7 8.5l2.942 1.74c1.715 1.014 2.4 1.014 4.116 0L17 8.5"
                      />
                      <path
                        d="M2.016 13.476c.065 3.065.098 4.598 1.229 5.733c1.131 1.136 2.705 1.175 5.854 1.254c1.94.05 3.862.05 5.802 0c3.149-.079 4.723-.118 5.854-1.254c1.131-1.135 1.164-2.668 1.23-5.733c.02-.986.02-1.966 0-2.952c-.066-3.065-.099-4.598-1.23-5.733c-1.131-1.136-2.705-1.175-5.854-1.254a115 115 0 0 0-5.802 0c-3.149.079-4.723.118-5.854 1.254c-1.131 1.135-1.164 2.668-1.23 5.733a69 69 0 0 0 0 2.952Z"
                      />
                    </g>
                  </svg>
                </i>
                <input
                  type="email"
                  class="form-control"
                  placeholder="البريد الإلكتروني"
                  required
                />
              </div>

              <!-- حقل كلمة المرور مع الأيقونات بداخلها -->
              <div class="input-group-custom mb-1">
                <i class="input-icon-main">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="1.3em"
                    height="1.3em"
                    viewBox="0 0 24 24"
                  >
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.5"
                      d="M15.5 14.5a6 6 0 1 0-5.47-3.53L2.5 18.5v3h3v-2h2v-2h2l3.53-3.53c.754.34 1.59.53 2.47.53m2-8l-1 1"
                    />
                  </svg>
                </i>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="كلمة المرور"
                  required
                />
                <i
                  class="fas fa-eye input-icon-left"
                  id="togglePassword"
                  style="cursor: pointer"
                ></i>
              </div>

              <div class="remember-me">
                <input
                  class="form-check-input"
                  type="checkbox"
                  value=""
                  id="checkDefault"
                />
                <label class="form-check-label font-13" for="checkDefault">
                  تذكرني
                </label>
              </div>

              <button type="submit" class="btn-submit-green">انشئ حساب</button>

              <div class="divider-line">أو</div>

              <!-- أزرار التواصل الاجتماعي -->
              <button type="button" class="btn btn-social-media btn-google">
                <i class="fab fa-google"></i>
                تسجيل الدخول باستخدام google
              </button>

              <button type="button" class="btn btn-social-media btn-facebook">
                <i class="facebook-icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="2em"
                    height="2em"
                    viewBox="0 0 24 24"
                  >
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path
                      fill="currentColor"
                      d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95"
                    />
                  </svg>
                </i>
                تسجيل الدخول باستخدام facebook
              </button>

              <button type="button" class="btn btn-social-media btn-apple">
                <i class="fab fa-apple"></i>
                تسجيل الدخول باستخدام apple
              </button>

              <div class="link-create-account text-center">
                هل لديك حساب؟ <a href="login.html">تسجيل دخول</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

      crossorigin="anonymous"

    <script

      integrity="sha512-uURl+ZXMBrF4AwGaWmEetzrd+J5/8NRkWAvJx5sbPSSuOb0bZLqf+tOzniObO00BjHa/dD7gub9oCGMLPQHtQA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="assets/js/translate.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
